name: Build SimpleShop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sestavit plugin (Maven)
        run: mvn -B clean package

      - name: Nahrat vysledny .jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpleShop
          path: target/SimpleShop.jar
